services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-team_website}
      DB_USERNAME: ${MYSQL_USER:-team}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-demo-only}
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "/app/infra/probe/health.php"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-team_website}
      MYSQL_USER: ${MYSQL_USER:-team}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-storage-engine=InnoDB
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql:/opt/project-tools:ro
    healthcheck:
      # Readiness means the application account can query the initialized database.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
