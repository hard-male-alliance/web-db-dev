name: Local environment

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: web-db-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate and start the pinned environment
        run: |
          docker compose config --quiet
          python scripts/dev.py up
      - name: Check runtime, real database behavior, and HTTP response
        run: |
          python scripts/dev.py check
          docker compose exec -T app composer audit
          docker compose exec -T app php tests/toolchain.php
          docker compose exec -T app php tests/database.php
          curl --fail --retry 5 http://127.0.0.1:8080/health
      - name: Exercise the actual visitor, member, and administrator journeys
        run: python tests/application_journey.py --base-url http://127.0.0.1:8080
      - name: Verify persistence across container replacement
        run: |
          token=$(openssl rand -hex 16)
          mkdir -p .cache
          printf '%s' "$token" > .cache/persistence-token
          docker compose exec -T app php scripts/domain_snapshot.php > .cache/domain-before.json
          docker compose exec -T app php scripts/database.php mark "$token"
          docker compose down
          docker compose up --wait --wait-timeout 240
          docker compose exec -T app php scripts/database.php verify "$token"
          docker compose exec -T app php scripts/domain_snapshot.php > .cache/domain-recreated.json
          diff -u .cache/domain-before.json .cache/domain-recreated.json
      - name: Export and restore into an empty volume
        run: |
          token=$(cat .cache/persistence-token)
          docker compose exec -T app php scripts/database.php mark "$token"
          python scripts/dev.py export
          # Only this isolated CI project's disposable volume is removed.
          docker compose down --volumes
          docker compose up --wait --wait-timeout 240
          python scripts/dev.py restore --confirm-restore
          docker compose exec -T app php scripts/database.php verify "$token"
          docker compose exec -T app php tests/database.php
          docker compose exec -T app php scripts/domain_snapshot.php > .cache/domain-restored.json
          diff -u .cache/domain-before.json .cache/domain-restored.json
          curl --fail http://127.0.0.1:8080/health
          python tests/application_journey.py --base-url http://127.0.0.1:8080
      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Clean up this CI project's containers and volumes
        if: always()
        run: docker compose down --volumes
